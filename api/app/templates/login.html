<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login — Fitness Temple Admin Panel">
    <title>Login — Fitness Temple</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="card">
                <div class="login-brand">
                    <div class="icon">🏛️</div>
                    <h1>Fitness Temple</h1>
                    <p>Admin Panel</p>
                </div>

                {% if error %}
                <div class="alert alert-error">{{ error }}</div>
                {% endif %}

                <form action="/login" method="post" id="login-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" class="form-control"
                               placeholder="Enter username" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-control"
                               placeholder="Enter password" required autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg" style="width:100%">
                        Sign In
                    </button>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <a href="/explore" style="color: var(--text-muted); font-size: 0.85rem;">← Back to Temple Fitness Showcase</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
